# ══════════════════════════════════════════════════════════════════════════════
# NOC Services Go — Application Configuration
# All secrets use ${ENV_VAR} placeholders for environment-based injection.
# Mirrors: src/main/resources/application.properties
# ══════════════════════════════════════════════════════════════════════════════

server:
  port: 8100
  context: /noc-services

# ── Database ──────────────────────────────────────────────────────────────────
db:
  host: localhost
  port: 5433
  name: testing_changes
  user: postgres
  password: postgres
  schema: public

# ── Kafka ─────────────────────────────────────────────────────────────────────
kafka:
  brokers:
    - localhost:9092
  consumer:
    group: egov-noc-services

# ── Persister Topics ──────────────────────────────────────────────────────────
persister:
  save:
    topic: save-noc-application
  update:
    topic: update-noc-application
  updateWorkflow:
    topic: update-noc-workflow

# ── ID Generation ─────────────────────────────────────────────────────────────
idgen:
  host: http://localhost:8088
  path: /egov-idgen/id/_generate
  applicationId: noc.application.number

# ── User Service ──────────────────────────────────────────────────────────────
user:
  host: http://localhost:8081
  contextPath: /user/users
  searchEndpoint: /user/_search

# ── Workflow ──────────────────────────────────────────────────────────────────
workflow:
  host: http://localhost:8280
  transitionPath: /egov-workflow-v2/egov-wf/process/_transition
  processPath: /egov-workflow-v2/egov-wf/process/_search
  businessServiceSearchPath: /egov-workflow-v2/egov-wf/businessservice/_search

# ── MDMS ──────────────────────────────────────────────────────────────────────
mdms:
  host: http://localhost:8094
  endpoint: /egov-mdms-service/v1/_search

# ── BPA ───────────────────────────────────────────────────────────────────────
bpa:
  host: https://dev.digit.org
  contextPath: /bpa-services/v1/bpa
  searchEndpoint: /_search

# ── SMS / Notification ────────────────────────────────────────────────────────
notification:
  sms:
    topic: egov.core.notification.sms
    enabled: true

# ── Localization ──────────────────────────────────────────────────────────────
localization:
  host: http://localhost:8087
  contextPath: /localization/messages/v1
  searchEndpoint: /_search
  stateLevel: true

# ── Pagination ────────────────────────────────────────────────────────────────
pagination:
  defaultOffset: 0
  defaultLimit: 10
  maxLimit: 1000

# ── NOC Feature Flags ─────────────────────────────────────────────────────────
noc:
  offlineDocRequired: false
  fuzzySearchEnabled: true
